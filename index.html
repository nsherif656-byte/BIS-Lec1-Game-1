<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Factory Rush 🏭⚡</title>
    <style>
        :root {
            --primary: #4f46e5;
            --data-color: #f59e0b;
            --process-color: #8b5cf6;
            --info-color: #06b6d4;
            --knowledge-color: #10b981;
            --bg-color: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .game-card {
            background: #1e293b;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 25px;
            position: relative;
            overflow: hidden;
            border: 2px solid #334155;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #6366f1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            font-weight: 700;
            font-size: 16px;
        }

        .stat-badge {
            background: #334155;
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* Factory Conveyor Belt Area */
        .factory-stage {
            height: 240px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            border: 2px dashed #475569;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .falling-card {
            position: absolute;
            background: #334155;
            border: 3px solid #64748b;
            border-radius: 15px;
            padding: 15px 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: transform 0.1s linear;
            max-width: 80%;
        }

        .card-emoji {
            font-size: 38px;
            margin-bottom: 5px;
        }

        .card-text {
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
        }

        /* Action Buttons Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-action:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        .btn-data { background-color: var(--data-color); }
        .btn-process { background-color: var(--process-color); }
        .btn-info { background-color: var(--info-color); }
        .btn-knowledge { background-color: var(--knowledge-color); }

        /* Floating Feedback */
        .feedback-pop {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 32px;
            font-weight: 900;
            padding: 10px 25px;
            border-radius: 30px;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .feedback-pop.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-pop.correct {
            background: #10b981;
            color: white;
        }

        .feedback-pop.wrong {
            background: #ef4444;
            color: white;
        }

        /* Overlay Screens */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }

        .btn-start {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
            margin-top: 20px;
        }

        .btn-start:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header">
        <div class="title">🏭 Data Factory Rush</div>
        <div class="stats-bar">
            <div class="stat-badge" id="scoreDisplay">Score: 0</div>
            <div class="stat-badge" style="color: #ef4444;" id="livesDisplay">❤️❤️❤️</div>
        </div>
    </div>

    <!-- Factory Conveyor belt -->
    <div class="factory-stage" id="factoryStage">
        <div id="activeCard" class="falling-card" style="display: none;">
            <div class="card-emoji" id="cardEmoji">📦</div>
            <div class="card-text" id="cardText">Raw Item</div>
        </div>
        <div id="feedbackPop" class="feedback-pop">Good! 👏</div>
    </div>

    <!-- Action Buttons -->
    <div class="controls-grid">
        <button class="btn-action btn-data" onclick="submitCategory('DATA')">
            <span>🔢 DATA</span>
            <span style="font-size:12px; opacity:0.8;">(Raw facts)</span>
        </button>
        <button class="btn-action btn-process" onclick="submitCategory('PROCESS')">
            <span>⚙️ PROCESS</span>
            <span style="font-size:12px; opacity:0.8;">(Sorting/Grouping)</span>
        </button>
        <button class="btn-action btn-info" onclick="submitCategory('INFO')">
            <span>📊 INFORMATION</span>
            <span style="font-size:12px; opacity:0.8;">(Organized context)</span>
        </button>
        <button class="btn-action btn-knowledge" onclick="submitCategory('KNOWLEDGE')">
            <span>🧠 KNOWLEDGE</span>
            <span style="font-size:12px; opacity:0.8;">(Applied decisions)</span>
        </button>
    </div>

    <!-- Start / Game Over Overlay -->
    <div class="overlay-screen" id="overlay">
        <h1 style="font-size: 32px; color: #818cf8; margin-bottom: 10px;">🏭 Data Factory Rush</h1>
        <p style="color: #94a3b8; max-width: 500px; font-size: 16px; line-height: 1.5;">
            Items are moving down the factory line! Tap the correct classification button before time runs out!
        </p>
        <button class="btn-start" onclick="startGame()">Start Game 🚀</button>
    </div>
</div>

<script>
    // Concept database based strictly on the provided slides
    const itemsPool = [
        // Data items
        { text: 'Number "48"', emoji: '🔢', category: 'DATA' },
        { text: 'Word "Tuesday"', emoji: '📅', category: 'DATA' },
        { text: 'Barcode scan "SKU-30291"', emoji: '🏷️', category: 'DATA' },
        { text: 'Single raw sales figure', emoji: '📌', category: 'DATA' },
        { text: 'Unorganized measurement values', emoji: '📏', category: 'DATA' },

        // Process items
        { text: 'Grouping by product & date', emoji: '⚙️', category: 'PROCESS' },
        { text: 'Sorting and filtering raw facts', emoji: '🔄', category: 'PROCESS' },
        { text: 'Calculating totals and averages', emoji: '🧮', category: 'PROCESS' },
        { text: 'Summarizing daily transactions', emoji: '📝', category: 'PROCESS' },

        // Information items
        { text: '"48 units of SKU-30291 sold on Tuesday"', emoji: '📊', category: 'INFO' },
        { text: 'Weekly Trend Report', emoji: '📈', category: 'INFO' },
        { text: 'Organized and structured meaningful data', emoji: '📋', category: 'INFO' },

        // Knowledge items
        { text: 'Experienced manager decides to restock inventory', emoji: '🛒', category: 'KNOWLEDGE' },
        { text: 'Negotiating prices with suppliers using trend insight', emoji: '🤝', category: 'KNOWLEDGE' },
        { text: 'Applying experience to make strategic business decisions', emoji: '🧠', category: 'KNOWLEDGE' }
    ];

    let score = 0;
    let lives = 3;
    let currentItem = null;
    let dropInterval = null;
    let dropPosition = 0;
    let dropSpeed = 1.2;

    // Synthesized sound effects via Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'good') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function startGame() {
        score = 0;
        lives = 3;
        dropSpeed = 1.2;
        document.getElementById('scoreDisplay').textContent = `Score: 0`;
        document.getElementById('livesDisplay').textContent = '❤️❤️❤️';
        document.getElementById('overlay').style.display = 'none';
        nextCard();
    }

    function nextCard() {
        clearInterval(dropInterval);
        
        // Pick random item
        currentItem = itemsPool[Math.floor(Math.random() * itemsPool.length)];
        
        const cardEl = document.getElementById('activeCard');
        document.getElementById('cardEmoji').textContent = currentItem.emoji;
        document.getElementById('cardText').textContent = currentItem.text;
        cardEl.style.display = 'block';
        
        // Reset Position (animating scale and position)
        dropPosition = 0;
        cardEl.style.transform = `scale(0.8) translateY(-20px)`;
        cardEl.style.opacity = '1';

        // Animate card movement
        dropInterval = setInterval(() => {
            dropPosition += dropSpeed;
            cardEl.style.transform = `scale(${0.8 + (dropPosition/150)}) translateY(${dropPosition * 1.2}px)`;

            if (dropPosition >= 80) {
                // Time run out for this card
                clearInterval(dropInterval);
                handleMiss();
            }
        }, 30);
    }

    function submitCategory(category) {
        if (!currentItem || lives <= 0) return;

        clearInterval(dropInterval);

        if (category === currentItem.category) {
            playSound('good');
            score += 10;
            dropSpeed += 0.05; // Slightly speed up
            document.getElementById('scoreDisplay').textContent = `Score: ${score}`;
            showFeedback('Good! 👏', 'good');
        } else {
            playSound('wrong');
            showFeedback('Naughty corner 😒', 'wrong');
            deductLife();
        }

        if (lives > 0) {
            setTimeout(nextCard, 600);
        }
    }

    function handleMiss() {
        playSound('wrong');
        showFeedback('Naughty corner 😒', 'wrong');
        deductLife();
        if (lives > 0) {
            setTimeout(nextCard, 600);
        }
    }

    function deductLife() {
        lives--;
        let hearts = '';
        for (let i = 0; i < lives; i++) hearts += '❤️';
        document.getElementById('livesDisplay').textContent = hearts || '💀';

        if (lives <= 0) {
            setTimeout(gameOver, 800);
        }
    }

    function showFeedback(text, type) {
        const pop = document.getElementById('feedbackPop');
        pop.textContent = text;
        pop.className = `feedback-pop show ${type === 'good' ? 'correct' : 'wrong'}`;
        setTimeout(() => {
            pop.className = 'feedback-pop';
        }, 500);
    }

    function gameOver() {
        document.getElementById('activeCard').style.display = 'none';
        const overlay = document.getElementById('overlay');
        overlay.innerHTML = `
            <h1 style="font-size: 32px; color: #ef4444; margin-bottom: 10px;">🏭 Factory Stopped!</h1>
            <p style="font-size: 22px; color: #f8fafc; margin-bottom: 20px;">Your Final Score: <strong>${score}</strong></p>
            <button class="btn-start" onclick="startGame()">Play Again 🔄</button>
        `;
        overlay.style.display = 'flex';
    }
</script>

</body>
</html>
